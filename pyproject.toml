[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splunk-mcp-readonly"
version = "0.1.0"
description = "A read-only Model Context Protocol server for querying Splunk Enterprise and Splunk Cloud safely."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leandro F. Juárez" }]
keywords = ["splunk", "mcp", "model-context-protocol", "siem", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/lfjuarez/splunk-mcp-readonly"
Author = "https://www.linkedin.com/in/leandrofjuarez"

[project.scripts]
splunk-mcp = "splunk_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splunk_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
